[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book2audio"
version = "0.1.0"
description = "Layout-aware EPUB/PDF book text extraction and cleanup for audiobook pipelines."
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.26",
  "ebooklib>=0.20",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "Pillow>=10.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13"]
dev = ["pytest>=8.0"]

[project.scripts]
book2audio = "book2audio.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
